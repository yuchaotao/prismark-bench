name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Check the committed dataset matches the generator
        run: |
          prismark generate --out /tmp/test.jsonl
          diff -q /tmp/test.jsonl data/v0/test.jsonl
